schema_version = 1

[profile]
id = "python-314"
track = "local"
output_label = "current_full"
comparison_scope = "local_executor_table"

[requirements]
fresh_process_blocks = 5

[availability]
optional_backends = { interpreter_pool = "required_builtin", loky = "optional_must_be_present", joblib = "optional_must_be_present" }

[matrix]
python_versions = ["3.14"]

[[workloads]]
id = "trivial"
kind = "trivial"
tasks_per_sample = 1000
payload_bytes = 1024

[[workloads]]
id = "python-cpu"
kind = "python_cpu"
tasks_per_sample = 100
payload_bytes = 1024

[[backends]]
id = "pyroxide"
kind = "pyroxide"
workers = 4

[[backends]]
