schema_version = 1

[profile]
id = "soak"
track = "reliability"
output_label = "reliability_separate"
comparison_scope = "never_merge_with_steady_state_throughput"

[requirements]
fresh_process_blocks = 5
soak_minutes = 30
rc_soak_hours = 4

[availability]
optional_backends = {}

[matrix]
worker_levels = [4]

