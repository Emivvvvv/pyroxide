[package]
name = "pyroxide"
version = "0.10.0"
authors = ["Emirhan TALA <tala.emirhan@gmail.com>"]
description = "A bounded background task engine for Python, powered by Rust."
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emivvvvv/pyroxide"
documentation = "https://emivvvvv.github.io/pyroxide/"
keywords = ["rust", "python", "pyo3", "concurrency", "task-broker"]


[lib]
# "cdylib" produces the shared library required by Python C-extensions
name = "_pyroxide"
crate-type = ["cdylib"]

[dependencies]
crossbeam-channel = "0.5.16"
# Enable the "extension-module" feature to build a native Python module
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
slab = "0.4.12"
wasmtime = { version = "36.0.7", default-features = false, features = ["addr2line", "cranelift", "demangle", "runtime", "std", "wat"] }
libloading = "0.8"
rand = "0.8.5"
interprocess = "1.2.1"
shared_memory = "0.12.4"
object = { version = "0.36", default-features = false, features = ["read"] }
wat = "1.0"
sharded-slab = "0.1.7"
libc = "0.2"
