[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyro3"
version = "1.0.0rc1"
description = "A bounded background task engine for Python, powered by Rust."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
keywords = ["rust", "python", "pyo3", "concurrency", "task-broker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware :: Symmetric Multi-processing",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
    "maturin>=1.0,<2.0",
    "mypy>=1.10",
    "pdoc>=14",
    "pyyaml>=6,<7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
]
benchmark = [
    "psutil>=6.1,<8",
    "pyperf>=2.7,<3",
    "loky>=3.5,<4",
    "joblib>=1.4,<2",
    "cffi>=1.17,<2",
    "nanobind>=2.13,<3",
    "wasmtime>=36,<37",
    "jinja2>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/emivvvvv/pyroxide"
Repository = "https://github.com/emivvvvv/pyroxide"
"Bug Tracker" = "https://github.com/emivvvvv/pyroxide/issues"

[project.scripts]
pyroxide = "pyroxide.cli:main"

[tool.maturin]
python-source = "python"
module-name = "pyroxide._pyroxide"
features = ["pyo3/abi3-py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["python/pyroxide"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = [".", "python"]

